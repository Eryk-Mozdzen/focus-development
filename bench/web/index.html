<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,=">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 80vw;
            max-width: 1400px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            aspect-ratio: 2;
            padding: 16px;
        }

        .label {
            font-size: 1.5vw;
            color: #666;
            margin-bottom: 10px;
        }

        .value {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 600;
        }

        .value_raw {
            font-size: 1vw;
            color: #888;
        }

        .unit {
            font-size: 1.5vw;
            margin-top: 6px;
            margin-bottom: 6px;
            color: #888;
        }

        .buttons {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 1.5vw;
            border: none;
            border-radius: 10px;
            background: #2d6cdf;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #245bc0;
        }

        @media (max-width:900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:600px) {
            .container {
                width: 95vw;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        .slider_card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            margin-top: 20px;
            padding: 16px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider_card .value {
            margin-bottom: 16px;
        }

        input[type="range"] {
            --fill: 0%;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            cursor: pointer;
            margin: 0;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2d6cdf var(--fill), #ddd var(--fill));
        }

        input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2d6cdf var(--fill), #ddd var(--fill));
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            margin-top: -7px;
            border-radius: 50%;
            border: none;
            background: #2d6cdf;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #2d6cdf;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            background: #245bc0;
        }

        input[type="range"]:hover::-moz-range-thumb {
            background: #245bc0;
        }

        input[type="range"]:focus-visible {
            outline: 2px solid #2d6cdf;
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>

    <script>
        const ws = new WebSocket("ws://" + location.host + "/websocket")

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data)

            document.getElementById("thrust").textContent = data.thrust.toFixed(3)
            document.getElementById("thrust_raw").textContent = data.thrust_raw + " LSB"
            document.getElementById("torque").textContent = data.torque.toFixed(5)
            document.getElementById("torque_raw1").textContent = data.torque_raw1 + " LSB"
            document.getElementById("torque_raw2").textContent = data.torque_raw2 + " LSB"
            document.getElementById("velocity").textContent = data.vel.toFixed(0)
            document.getElementById("velocity_raw").textContent = data.vel_raw.toFixed(2) + " Hz"
            document.getElementById("temperature").textContent = data.temp.toFixed(1)
            document.getElementById("temperature_raw1").textContent = data.temp_raw1 + " LSB"
            document.getElementById("temperature_raw2").textContent = data.temp_raw2.toFixed(0) + " ohm"
            document.getElementById("voltage").textContent = data.volt.toFixed(2)
            document.getElementById("current").textContent = data.curr.toFixed(2)

            document.getElementById("slider_value").textContent = (100 * data.gen).toFixed(0) + "%"
            document.getElementById("slider").value = 1000 * data.gen
        }

        function sendCommand(cmd) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(cmd)
            }
        }

        function sendGenerator() {
            const value = document.getElementById("slider").value
            document.getElementById("slider_value").textContent = (0.1 * value).toFixed(0) + "%"
            sendCommand("generator " + value)
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="grid">

            <div class="card">
                <div class="label">Thrust</div>
                <div class="value" id="thrust">0.00</div>
                <div class="unit">N</div>
                <div class="value_raw" id="thrust_raw">0 LSB</div>
            </div>

            <div class="card">
                <div class="label">Torque</div>
                <div class="value" id="torque">0.00</div>
                <div class="unit">Nm</div>
                <div class="value_raw" id="torque_raw1">0 LSB</div>
                <div class="value_raw" id="torque_raw2">0 LSB</div>
            </div>

            <div class="card">
                <div class="label">Angular Velocity</div>
                <div class="value" id="velocity">0.00</div>
                <div class="unit">rad/s</div>
                <div class="value_raw" id="velocity_raw">0 Hz</div>
            </div>

            <div class="card">
                <div class="label">Temperature</div>
                <div class="value" id="temperature">0.0</div>
                <div class="unit">°C</div>
                <div class="value_raw" id="temperature_raw1">0 LSB</div>
                <div class="value_raw" id="temperature_raw2">0 ohm</div>
            </div>

            <div class="card">
                <div class="label">Voltage</div>
                <div class="value" id="voltage">0.00</div>
                <div class="unit">V</div>
            </div>

            <div class="card">
                <div class="label">Current</div>
                <div class="value" id="current">0.00</div>
                <div class="unit">A</div>
            </div>

        </div>

        <div class="buttons">
            <button onclick="sendCommand('offset')">Offset Calibration</button>
        </div>

        <div class="slider_card">
            <div class="label">Generator</div>
            <div class="value" id="slider_value">0</div>
            <input oninput="sendGenerator()" type="range" id="slider" value="0" min="0" max="1000" step="1">
        </div>
    </div>
</body>

</html>
