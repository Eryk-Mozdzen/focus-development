<!DOCTYPE html>
<html>

<head>
    <title>Motor Test Bench</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,=">

    <style>
        :root {
            color-scheme: light;
            --paper: #fff;
            --ink: #000;
            --muted: #000;
            --rule: #000;
            --accent: #000;
            --mono: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.45;
            font-variant-numeric: tabular-nums;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: min(100% - 40px, 920px);
            margin: 0 auto;
            padding: 30px 0 36px;
        }

        .container::before {
            content: "MOTOR TEST BENCH";
            display: block;
            padding: 0 0 10px;
            margin-bottom: 18px;
            border-bottom: 2px solid var(--ink);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            width: 100%;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .card {
            display: grid;
            grid-template-columns: minmax(190px, 1fr) minmax(200px, 240px) minmax(130px, .7fr);
            align-items: center;
            min-height: 47px;
            padding: 7px 10px;
            border-bottom: 1px solid var(--rule);
        }

        .card:nth-child(even) {
            background: #fff;
        }

        .label {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .value {
            font-family: var(--mono);
            font-size: 18px;
            font-weight: 700;
            white-space: pre;
            text-align: left;
        }

        .value_raw {
            color: var(--muted);
            font-size: 11px;
        }

        .raw-values {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 4ch;
            gap: 1px 5px;
            align-items: baseline;
        }

        .raw-number {
            text-align: right;
        }

        .raw-unit {
            text-align: left;
        }

        .unit {
            margin: 0 0 0 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .reading {
            display: grid;
            grid-template-columns: 12ch 5ch;
            align-items: baseline;
            gap: 4px;
            font-family: var(--mono);
            font-size: 18px;
        }

        .reading .value {
            width: 12ch;
        }

        .reading .unit {
            text-align: left;
        }

        .buttons {
            display: flex;
            justify-content: flex-start;
            margin-top: 18px;
        }

        button {
            padding: 8px 12px;
            border: 2px solid var(--ink);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink);
        }

        button:hover,
        button:focus-visible {
            background: var(--ink);
            color: var(--paper);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .slider_card {
            display: grid;
            grid-template-columns: minmax(130px, auto) 5ch minmax(100px, 1fr);
            align-items: center;
            gap: 14px;
            margin-top: 8px;
            padding: 9px 10px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .slider_card .value {
            margin: 0;
        }

        input[type="range"] {
            --fill: 0%;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            margin: 0;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border: 1px solid #000;
            background: linear-gradient(to right, #000 var(--fill), #fff var(--fill));
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            border: 1px solid #000;
            background: linear-gradient(to right, #000 var(--fill), #fff var(--fill));
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            margin-top: -4px;
            border: 1px solid var(--paper);
            border-radius: 0;
            background: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        input[type="range"]::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border: 1px solid var(--paper);
            border-radius: 0;
            background: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        input[type="range"]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        @media (max-width: 620px) {
            .container {
                width: min(100% - 24px, 920px);
                padding-top: 18px;
            }

            .card {
                grid-template-columns: minmax(105px, 1fr) minmax(145px, 1.15fr);
                gap: 2px 8px;
                padding-inline: 5px;
            }

            .reading {
                grid-template-columns: 12ch 5ch;
                font-size: 16px;
                gap: 1px;
            }

            .reading .value {
                font-size: 16px;
            }

            .value_raw,
            .raw-empty {
                display: none;
            }

            .label {
                font-size: 11px;
            }

            .slider_card {
                grid-template-columns: minmax(90px, auto) 5ch minmax(70px, 1fr);
                gap: 8px;
                padding-inline: 6px;
            }
        }

        @media (max-width: 360px) {
            .card {
                grid-template-columns: 95px minmax(0, 1fr);
            }

            .reading {
                grid-template-columns: 11ch 4ch;
                font-size: 14px;
            }

            .reading .value {
                width: 11ch;
                font-size: 14px;
            }
        }
    </style>

    <script>
        const ws = new WebSocket("ws://" + location.host + "/websocket")
        let currentIsZero = true

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data)

            document.getElementById("thrust").textContent = formatValue(data.thrust, 3, true)
            document.getElementById("thrust_raw").textContent = data.thrust_raw
            document.getElementById("torque").textContent = formatValue(data.torque, 5, true)
            document.getElementById("torque_raw1").textContent = data.torque_raw1
            document.getElementById("torque_raw2").textContent = data.torque_raw2
            document.getElementById("velocity").textContent = formatValue(data.vel, 2)
            document.getElementById("velocity_raw").textContent = Math.max(0, data.vel_raw).toFixed(2)
            document.getElementById("temperature").textContent = formatValue(data.temp, 1)
            document.getElementById("temperature_raw1").textContent = Math.max(0, data.temp_raw1)
            document.getElementById("temperature_raw2").textContent = Math.max(0, data.temp_raw2).toFixed(0)
            document.getElementById("voltage").textContent = formatValue(data.volt, 2)
            document.getElementById("current").textContent = formatCurrent(data.curr)
            document.getElementById("humidity").textContent = formatValue(data.env1_hum, 1)
            document.getElementById("env1_temperature").textContent = formatValue(data.env1_temp, 1)
            document.getElementById("pressure").textContent = formatValue(data.env2_press / 100, 1)
            document.getElementById("env2_temperature").textContent = formatValue(data.env2_temp, 1)

            document.getElementById("slider_value").textContent = (100 * data.gen).toFixed(0) + "%"
            document.getElementById("slider").value = 1000 * data.gen
            updateSliderRail()
        }

        function formatValue(value, decimals, allowNegative = false) {
            if (!allowNegative) value = Math.max(0, value)
            const rounded = Number(Math.abs(value).toFixed(decimals))
            const sign = allowNegative ? (value < 0 && rounded !== 0 ? "-" : "+") : ""
            const [integer, fraction] = rounded.toFixed(decimals).split(".")
            return (sign + integer).padStart(5, " ") + (fraction === undefined ? "" : "." + fraction)
        }

        function formatCurrent(value) {
            if (value < 0) currentIsZero = true
            else if (currentIsZero && value > 0.015) currentIsZero = false
            else if (!currentIsZero && value < 0.005) currentIsZero = true
            return formatValue(currentIsZero ? 0 : value, 2)
        }

        function sendCommand(cmd) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(cmd)
            }
        }

        function sendGenerator() {
            const value = document.getElementById("slider").value
            document.getElementById("slider_value").textContent = (0.1 * value).toFixed(0) + "%"
            updateSliderRail()
            sendCommand("generator " + value)
        }

        function updateSliderRail() {
            const slider = document.getElementById("slider")
            const percent = 100 * (slider.value - slider.min) / (slider.max - slider.min)
            slider.style.setProperty("--fill", percent + "%")
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="grid">

            <div class="card">
                <div class="label">Thrust</div>
                <div class="reading">
                    <div class="value" id="thrust">0.00</div>
                    <div class="unit">N</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="thrust_raw">0</span><span class="raw-unit">LSB</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Torque</div>
                <div class="reading">
                    <div class="value" id="torque">0.00</div>
                    <div class="unit">Nm</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="torque_raw1">0</span><span class="raw-unit">LSB</span>
                    <span class="raw-number" id="torque_raw2">0</span><span class="raw-unit">LSB</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Velocity</div>
                <div class="reading">
                    <div class="value" id="velocity">0.00</div>
                    <div class="unit">rad/s</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="velocity_raw">0</span><span class="raw-unit">Hz</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Temperature (Motor)</div>
                <div class="reading">
                    <div class="value" id="temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="temperature_raw1">0</span><span class="raw-unit">LSB</span>
                    <span class="raw-number" id="temperature_raw2">0</span><span class="raw-unit">ohm</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Voltage</div>
                <div class="reading">
                    <div class="value" id="voltage">0.00</div>
                    <div class="unit">V</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Current</div>
                <div class="reading">
                    <div class="value" id="current">0.00</div>
                    <div class="unit">A</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Humidity</div>
                <div class="reading">
                    <div class="value" id="humidity">0.0</div>
                    <div class="unit">% RH</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Temperature (Humidity Sensor)</div>
                <div class="reading">
                    <div class="value" id="env1_temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Pressure</div>
                <div class="reading">
                    <div class="value" id="pressure">0.0</div>
                    <div class="unit">hPa</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Temperature (Pressure Sensor)</div>
                <div class="reading">
                    <div class="value" id="env2_temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="raw-empty"></div>
            </div>

        </div>

        <div class="buttons">
            <button onclick="sendCommand('offset')">Offset Calibration</button>
        </div>

        <div class="slider_card">
            <div class="label">Generator</div>
            <div class="value" id="slider_value">0</div>
            <input oninput="sendGenerator()" type="range" id="slider" value="0" min="0" max="1000" step="1">
        </div>
    </div>
</body>

</html>
