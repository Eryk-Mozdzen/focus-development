<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:;base64,=">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(96vw, 1500px);
            margin: auto;
            padding: 10px 14px;
        }

        h1 {
            text-align: center;
            margin: 0 0 6px;
            font-weight: 500;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
            display: grid;
            grid-template-columns: minmax(125px, 1fr) 210px minmax(100px, 1fr);
            align-items: center;
            min-height: 40px;
            padding: 4px 12px;
        }

        .label {
            font-size: 15px;
            color: #666;
            margin: 0;
        }

        .value {
            font: 600 20px ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: pre;
            text-align: left;
        }

        .value_raw {
            font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
            color: #888;
        }

        .raw-values {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 4ch;
            gap: 1px 4px;
            align-items: baseline;
        }

        .raw-number {
            text-align: right;
        }

        .raw-unit {
            text-align: left;
        }

        .unit {
            font-size: 13px;
            margin: 0 0 0 5px;
            color: #888;
        }

        .reading {
            display: grid;
            font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
            font-size: 20px;
            grid-template-columns: 12ch 5ch;
            align-items: baseline;
            gap: 4px;
        }

        .reading .value {
            width: 12ch;
        }

        .reading .unit {
            text-align: left;
        }

        .buttons {
            margin-top: 5px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 12px;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            background: #2d6cdf;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #245bc0;
        }

        .slider_card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            margin-top: 5px;
            padding: 5px 10px 8px;
            display: grid;
            grid-template-columns: auto auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .slider_card .value {
            margin: 0;
        }

        input[type="range"] {
            --fill: 0%;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            background: transparent;
            cursor: pointer;
            margin: 0;
        }

        @media (max-height: 650px) {
            .container {
                padding-top: 3px;
                padding-bottom: 3px;
            }

            .grid {
                gap: 2px;
            }

            .card {
                min-height: 30px;
                padding: 2px 8px;
            }

            .buttons,
            .slider_card {
                margin-top: 3px;
            }

            .slider_card {
                padding: 3px 8px 5px;
            }

            input[type="range"] {
                height: 18px;
            }
        }

        @media (max-width: 420px) {
            .card {
                grid-template-columns: minmax(75px, 1fr) 120px minmax(0, 1fr);
                padding-inline: 6px;
            }

            .reading {
                font-size: 14px;
                grid-template-columns: 12ch 4ch;
                gap: 2px;
            }

            .reading .value {
                font-size: 14px;
            }

            .label {
                font-size: 12px;
            }

            .value_raw {
                font-size: 10px;
            }
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2d6cdf var(--fill), #ddd var(--fill));
        }

        input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2d6cdf var(--fill), #ddd var(--fill));
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            margin-top: -7px;
            border-radius: 50%;
            border: none;
            background: #2d6cdf;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #2d6cdf;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            background: #245bc0;
        }

        input[type="range"]:hover::-moz-range-thumb {
            background: #245bc0;
        }

        input[type="range"]:focus-visible {
            outline: 2px solid #2d6cdf;
            outline-offset: 4px;
            border-radius: 4px;
        }
    </style>

    <script>
        const ws = new WebSocket("ws://" + location.host + "/websocket")
        let currentIsZero = true

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data)

            document.getElementById("thrust").textContent = formatValue(data.thrust, 3, true)
            document.getElementById("thrust_raw").textContent = data.thrust_raw
            document.getElementById("torque").textContent = formatValue(data.torque, 5, true)
            document.getElementById("torque_raw1").textContent = data.torque_raw1
            document.getElementById("torque_raw2").textContent = data.torque_raw2
            document.getElementById("velocity").textContent = formatValue(data.vel, 2)
            document.getElementById("velocity_raw").textContent = Math.max(0, data.vel_raw).toFixed(2)
            document.getElementById("temperature").textContent = formatValue(data.temp, 1)
            document.getElementById("temperature_raw1").textContent = Math.max(0, data.temp_raw1)
            document.getElementById("temperature_raw2").textContent = Math.max(0, data.temp_raw2).toFixed(0)
            document.getElementById("voltage").textContent = formatValue(data.volt, 2)
            document.getElementById("current").textContent = formatCurrent(data.curr)
            document.getElementById("humidity").textContent = formatValue(data.env1_hum, 1)
            document.getElementById("env1_temperature").textContent = formatValue(data.env1_temp, 1)
            document.getElementById("pressure").textContent = formatValue(data.env2_press / 100, 1)
            document.getElementById("env2_temperature").textContent = formatValue(data.env2_temp, 1)

            document.getElementById("slider_value").textContent = (100 * data.gen).toFixed(0) + "%"
            document.getElementById("slider").value = 1000 * data.gen
        }

        function formatValue(value, decimals, allowNegative = false) {
            if (!allowNegative) value = Math.max(0, value)
            const rounded = Number(Math.abs(value).toFixed(decimals))
            const sign = allowNegative ? (value < 0 && rounded !== 0 ? "-" : "+") : ""
            const [integer, fraction] = rounded.toFixed(decimals).split(".")
            return (sign + integer).padStart(5, " ") + (fraction === undefined ? "" : "." + fraction)
        }

        function formatCurrent(value) {
            if (value < 0) currentIsZero = true
            else if (currentIsZero && value > 0.015) currentIsZero = false
            else if (!currentIsZero && value < 0.005) currentIsZero = true
            return formatValue(currentIsZero ? 0 : value, 2)
        }

        function sendCommand(cmd) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(cmd)
            }
        }

        function sendGenerator() {
            const value = document.getElementById("slider").value
            document.getElementById("slider_value").textContent = (0.1 * value).toFixed(0) + "%"
            sendCommand("generator " + value)
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="grid">

            <div class="card">
                <div class="label">Thrust</div>
                <div class="reading">
                    <div class="value" id="thrust">0.00</div>
                    <div class="unit">N</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="thrust_raw">0</span><span class="raw-unit">LSB</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Torque</div>
                <div class="reading">
                    <div class="value" id="torque">0.00</div>
                    <div class="unit">Nm</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="torque_raw1">0</span><span class="raw-unit">LSB</span>
                    <span class="raw-number" id="torque_raw2">0</span><span class="raw-unit">LSB</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Velocity</div>
                <div class="reading">
                    <div class="value" id="velocity">0.00</div>
                    <div class="unit">rad/s</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="velocity_raw">0</span><span class="raw-unit">Hz</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Temperature (Motor)</div>
                <div class="reading">
                    <div class="value" id="temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="value_raw raw-values">
                    <span class="raw-number" id="temperature_raw1">0</span><span class="raw-unit">LSB</span>
                    <span class="raw-number" id="temperature_raw2">0</span><span class="raw-unit">ohm</span>
                </div>
            </div>

            <div class="card">
                <div class="label">Voltage</div>
                <div class="reading">
                    <div class="value" id="voltage">0.00</div>
                    <div class="unit">V</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Current</div>
                <div class="reading">
                    <div class="value" id="current">0.00</div>
                    <div class="unit">A</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Humidity</div>
                <div class="reading">
                    <div class="value" id="humidity">0.0</div>
                    <div class="unit">% RH</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Temperature (Humidity Sensor)</div>
                <div class="reading">
                    <div class="value" id="env1_temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Pressure</div>
                <div class="reading">
                    <div class="value" id="pressure">0.0</div>
                    <div class="unit">hPa</div>
                </div>
                <div class="raw-empty"></div>
            </div>

            <div class="card">
                <div class="label">Temperature (Pressure Sensor)</div>
                <div class="reading">
                    <div class="value" id="env2_temperature">0.0</div>
                    <div class="unit">°C</div>
                </div>
                <div class="raw-empty"></div>
            </div>

        </div>

        <div class="buttons">
            <button onclick="sendCommand('offset')">Offset Calibration</button>
        </div>

        <div class="slider_card">
            <div class="label">Generator</div>
            <div class="value" id="slider_value">0</div>
            <input oninput="sendGenerator()" type="range" id="slider" value="0" min="0" max="1000" step="1">
        </div>
    </div>
</body>

</html>
